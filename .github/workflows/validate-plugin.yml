name: Validate Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          echo "Validating plugin.json..."
          if ! jq empty plugin.json 2>/dev/null; then
            echo "ERROR: plugin.json is not valid JSON"
            exit 1
          fi
          for field in name version skills; do
            if ! jq -e ".$field" plugin.json > /dev/null 2>&1; then
              echo "ERROR: Missing required field '$field'"
              exit 1
            fi
          done
          echo "✅ plugin.json is valid"

      - name: Validate skill structure
        run: |
          while IFS= read -r configured_root; do
            root="${configured_root%/}"
            if [ ! -d "$root" ]; then
              echo "ERROR: Configured skill root '$root' does not exist"
              exit 1
            fi

            found=false
            while IFS= read -r skill_file; do
              found=true
              echo "Validated ${skill_file%/SKILL.md}"
            done < <(find "$root" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | sort)

            if [ "$found" = false ]; then
              echo "ERROR: No skills found under configured root '$root'"
              exit 1
            fi
          done < <(jq -r '.skills[]' plugin.json)
